name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality, tests, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check --output-format=github .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check types
        run: python -m mypy
      - name: Test and validate trajectory records
        run: python -m pytest
      - name: Test the scroll replay progress mapping
        run: node --test tests/test_replay_motion.mjs
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke test the installed wheel
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          trajyn generate --seed 42 --split test --count 3 --output runs/tasks.jsonl
          trajyn demo --seed 42 --split test --output runs/first.jsonl
          trajyn demo --seed 42 --split test --output runs/second.jsonl
          cmp runs/first.jsonl runs/second.jsonl
      - name: Evaluate paired conditions offline
        run: |
          trajyn collect --seeds 0,1,2,3,4
          trajyn induce --created-at 2026-01-01T00:00:00+00:00
          trajyn evaluate --seeds 200,201,202,203 --no-timing
          trajyn compare
          cmp runs/evaluation/comparison.md reports/comparison.md
      - name: Replay archived local pilot offline
        run: |
          python - <<'PY'
          from pathlib import Path
          from trajyn.capability import read_capsules
          from trajyn.evaluation import read_sources
          from trajyn.induction import induce
          from trajyn.provenance import read_trajectory
          from trajyn.report import read_evaluation

          root = Path("examples/local-pilot/action-first")
          sources = read_sources(root / "source")
          capsules = read_capsules(root / "capsules.jsonl")
          for source, capsule in zip(sources, capsules, strict=True):
              assert capsule == induce(source, created_at=capsule.created_at)
          result = read_evaluation(root / "evaluation/results.json")
          for row in result.trials:
              trace = read_trajectory(root / "evaluation" / row.trajectory_file)
              assert trace.trajectory_id == row.trajectory_id
              assert trace.verification.passed == row.passed
          PY
      - name: Replay and compare Experiment 001 offline
        run: |
          root=examples/experiment-001/run
          trajyn analyze --results "$root/evaluation/results.json" --output runs/experiment-001
          cmp "$root/evaluation/analysis.json" runs/experiment-001/analysis.json
          python - <<'PY'
          import json
          from pathlib import Path
          from trajyn.capability import read_capsules
          from trajyn.evaluation import read_sources
          from trajyn.induction import induce
          from trajyn.provenance import read_trajectory

          root = Path("examples/experiment-001")
          for artifact in (root / "calibration").glob("*/calibration.json"):
              for attempt in json.loads(artifact.read_text())["attempts"]:
                  trace = read_trajectory(artifact.parent / attempt["trajectory"])
                  assert trace.trajectory_id == attempt["trajectory_id"]
                  assert trace.verification.passed == attempt["verified"]
          run = root / "run"
          sources = {source.trajectory_id: source for source in read_sources(run / "source")}
          for capsule in read_capsules(run / "capsules.jsonl"):
              source = sources[capsule.evidence[0].trajectory_id]
              assert capsule == induce(source, created_at=capsule.created_at)
          PY
      - name: Replay and compare Experiment 002 offline
        run: |
          base=examples/experiment-002/run
          for mode in grounded unaided secondary-grounded secondary-unaided; do
            root="$base/$mode"
            trajyn analyze --results "$root/evaluation/results.json" --output "runs/experiment-002/$mode"
            cmp "$root/evaluation/analysis.json" "runs/experiment-002/$mode/analysis.json"
            cmp "$root/evaluation/analysis.md" "runs/experiment-002/$mode/analysis.md"
            cmp "$base/grounded/source/manifest.json" "$root/source/manifest.json"
            cmp "$base/grounded/capsules.jsonl" "$root/capsules.jsonl"
            cmp "$base/grounded/evaluation/retrieval.json" "$root/evaluation/retrieval.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from trajyn.agent import AgentContext
          from trajyn.branching import BranchTransfer
          from trajyn.capability import read_capsules
          from trajyn.evaluation import Condition, _transfer_audit, read_sources
          from trajyn.induction import induce
          from trajyn.models import StopReason, public_task
          from trajyn.provenance import read_trajectory
          from trajyn.recording import encode_json
          from trajyn.report import read_evaluation
          from trajyn.runner import environment_for

          root = Path("examples/experiment-002")
          for artifact in (root / "calibration").glob("*/calibration.json"):
              for attempt in json.loads(artifact.read_text())["attempts"]:
                  trace = read_trajectory(artifact.parent / attempt["trajectory"])
                  assert trace.trajectory_id == attempt["trajectory_id"]
                  assert trace.verification.passed == attempt["verified"]
          for run in (root / "run").iterdir():
              sources = {source.trajectory_id: source for source in read_sources(run / "source")}
              capsules = {c.capability_id: c for c in read_capsules(run / "capsules.jsonl")}
              for capsule in capsules.values():
                  assert capsule == induce(
                      sources[capsule.evidence[0].trajectory_id], created_at=capsule.created_at
                  )
              directory = run / "evaluation"
              audit = json.loads((directory / "transfer.json").read_text())
              reproduced = []
              for row in read_evaluation(directory / "results.json").trials:
                  if row.condition not in (Condition.CAPSULE, Condition.DYNAMIC):
                      continue
                  trace = read_trajectory(directory / row.trajectory_file)
                  task, tools = public_task(trace.task), environment_for(trace.task).tools
                  assert row.transfer is not None
                  capsule = capsules[row.transfer.capsule_id]
                  policy = BranchTransfer(task, tools, (capsule,))
                  if row.condition == Condition.DYNAMIC:
                      calls = len(trace.steps) + (trace.stop_reason == StopReason.AGENT_STOPPED)
                      for step in range(calls):
                          policy.memory_for(AgentContext(task, tools, trace.steps[:step], trace.max_steps))
                      policy.finish(AgentContext(task, tools, trace.steps, trace.max_steps))
                  reproduced.append(
                      _transfer_audit(row.condition, capsule, trace, policy, row.memory_delivered)
                  )
              assert encode_json(reproduced) == encode_json(audit["trials"])
          PY

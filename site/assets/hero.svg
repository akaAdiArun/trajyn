<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">Experience transfer between two agents</title>
  <desc id="desc">Three cyan trajectories enter a serializable capsule, then leave it as violet paths toward a target agent.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".85" fill="#92a9cd" fill-opacity=".28"/>
    </pattern>
    <radialGradient id="fade">
      <stop stop-color="#fff"/>
      <stop offset=".68" stop-color="#fff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade-grid">
      <ellipse cx="323" cy="243" rx="318" ry="235" fill="url(#fade)"/>
    </mask>
    <radialGradient id="ambient">
      <stop stop-color="#5b4fdb" stop-opacity=".23"/>
      <stop offset="1" stop-color="#5b4fdb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop stop-color="#101e33"/>
      <stop offset="1" stop-color="#252548"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="90%" y2="100%">
      <stop stop-color="#183650"/>
      <stop offset="1" stop-color="#101629"/>
    </linearGradient>
    <linearGradient id="violet-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#242047"/>
      <stop offset="1" stop-color="#14172c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop stop-color="#60e7ec"/>
      <stop offset=".53" stop-color="#83affa"/>
      <stop offset="1" stop-color="#a594ff"/>
    </linearGradient>
    <linearGradient id="in">
      <stop stop-color="#60e7ec" stop-opacity=".25"/>
      <stop offset="1" stop-color="#60e7ec" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="out">
      <stop stop-color="#a594ff" stop-opacity=".88"/>
      <stop offset="1" stop-color="#a594ff" stop-opacity=".3"/>
    </linearGradient>
    <filter id="edge-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <path id="input-route" d="M110 226H162l30-30h61"/>
    <path id="output-route" d="M489 221h30l31-31h32"/>
  </defs>
  <style>
    .signal { stroke-dasharray: 8 92; animation: travel 4.8s linear infinite; }
    .signal-out { animation-delay: -2.35s; }
    @keyframes travel { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; animation: none; } }
  </style>
  <ellipse cx="363" cy="243" rx="275" ry="209" fill="url(#ambient)"/>
  <path d="M0 0h640v480H0z" fill="url(#dots)" mask="url(#fade-grid)"/>
  <g fill="none" stroke="#283753" stroke-width="1" opacity=".69">
    <path d="M105 348l247-138 198 113-246 137z"/>
    <path d="M160 380l246-139M216 411l247-138M272 442l246-138M155 320l197 113M204 292l197 113M253 265l197 113M302 237l197 113"/>
    <path d="M101 378l124 70m320-96-132 73" stroke-dasharray="4 9" opacity=".65"/>
  </g>
  <g fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 212h37l39-39h67M110 240h64l21-21h58" stroke="url(#in)"/>
    <use href="#input-route" stroke="url(#in)" stroke-width="2"/>
    <path d="M489 204h26l23-23h45M489 238h42l29-29h23" stroke="url(#out)"/>
    <use href="#output-route" stroke="url(#out)" stroke-width="2"/>
    <path class="signal" pathLength="100" d="M110 226H162l30-30h61" stroke="#c3ffff" stroke-width="2.8"/>
    <path class="signal signal-out" pathLength="100" d="M489 221h30l31-31h32" stroke="#e8deff" stroke-width="2.8"/>
  </g>
  <g fill="none" stroke-linejoin="round">
    <path d="m247 331 123-70 122 70-122 70z" stroke="url(#edge)" opacity=".21" stroke-dasharray="3 6"/>
    <path d="m265 331 105-60 104 60-104 60z" fill="#0c1424" stroke="#283753"/>
    <path d="m325 332 45 26 44-26-44-25z" fill="#6a60d2" opacity=".22" filter="url(#edge-glow)"/>
    <path d="M370 357v-31m-105 5v-38m209 38v-38" stroke="#58678f" opacity=".42" stroke-dasharray="2 5"/>
    <path d="M254 152l116-66 118 66v131l-118 67-116-67z" stroke="url(#edge)" stroke-width="3" opacity=".4" filter="url(#edge-glow)"/>
    <path d="M254 152l116 67v131l-116-67z" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M370 219l118-67v131l-118 67z" fill="url(#violet-glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="m254 152 116-66 118 66-118 67z" fill="url(#top)" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="m280 152 90-51 91 51-91 52z" stroke="#7482bd" stroke-opacity=".55"/>
    <path d="m306 152 64-36 64 36-64 37z" fill="#161c37" stroke="#97a2f3" stroke-opacity=".45"/>
    <path d="m271 164 99 57 101-58M254 255l116 67 118-67" stroke="url(#edge)" stroke-opacity=".36"/>
    <path d="m274 187 76 44v65l-76-44zM390 231l78-45v65l-78 44z" stroke="#7594b7" stroke-opacity=".38"/>
    <path d="m287 220 45 26m-45-15 34 20m-34-9 24 14" stroke="#60e7ec" stroke-opacity=".71" stroke-width="2"/>
    <path d="m404 270 49-28m-49 17 49-28m-49 17 49-28" stroke="#a594ff" stroke-opacity=".64" stroke-width="2"/>
    <path d="m332 149 39-22 36 20-39 23" stroke="#9bdde9" stroke-opacity=".19" stroke-width="9" filter="url(#edge-glow)"/>
    <path d="m337 148 35-20 31 18-20 12-1 13" stroke="#71ecef" stroke-width="3" stroke-linecap="round"/>
    <path d="m361 163 1-13 17-10" stroke="#c4b5ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="337" cy="148" r="3" fill="#e0ffff"/>
    <circle cx="403" cy="146" r="3" fill="#e0ffff"/>
    <circle cx="382" cy="171" r="3" fill="#e0ffff"/>
    <circle cx="254" cy="196" r="3.5" fill="#60e7ec"/>
    <circle cx="489" cy="221" r="3.5" fill="#a594ff"/>
    <circle cx="370" cy="86" r="2.5" fill="#c4b5ff"/>
    <circle cx="370" cy="350" r="2.5" fill="#a594ff"/>
  </g>
  <g transform="translate(85 226)" fill="none">
    <rect x="-27" y="-27" width="54" height="54" rx="12" fill="#111c2c" stroke="#60e7ec" stroke-opacity=".74"/>
    <rect x="-32" y="-32" width="64" height="64" rx="16" stroke="#60e7ec" stroke-opacity=".16"/>
    <path d="M-12-6h24M-12 1H4m-16 7H8" stroke="#60e7ec" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="12" cy="-6" r="2.6" fill="#d3ffff"/>
  </g>
  <g transform="translate(593 194)" fill="none">
    <rect x="-24" y="-24" width="48" height="48" rx="11" fill="#1c1a33" stroke="#a594ff" stroke-opacity=".83"/>
    <rect x="-29" y="-29" width="58" height="58" rx="15" stroke="#a594ff" stroke-opacity=".21"/>
    <path d="M-9-2h18m-9-9v18m-6-1 12-12" stroke="#a594ff" stroke-width="1.8" stroke-linecap="round"/>
    <circle r="3" fill="#eee8ff"/>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" letter-spacing="1.4" text-anchor="middle">
    <text x="85" y="280" fill="#99b8cb">AGENT A</text>
    <text x="593" y="245" fill="#bcb0ea">AGENT B</text>
  </g>
</svg>
